<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lens Desk — {{ settings.photographer_name or 'Photographer' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf3 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .navbar {
      background: linear-gradient(90deg, #1e293b 0%, #334155 100%) !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
    .card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .stat-card { transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-3px); }
    .badge-hot { background: #ef4444; }
    .badge-warm { background: #f59e0b; }
    .badge-cold { background: #3b82f6; }
    .btn-primary { background: #4f46e5; border: none; }
    .btn-primary:hover { background: #4338ca; }
    h1, h2, h3 { color: #1e293b; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">
      <i class="bi bi-camera"></i> Lens Desk
    </a>
    <div class="ms-auto">
      <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('add_lead') }}">
        <i class="bi bi-plus-circle"></i> New Enquiry
      </a>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('settings_page') }}">
        <i class="bi bi-gear"></i> Settings
      </a>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
</body>
</html>
